<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Secure DNS configuration profile generator for Apple devices." />
  <title>Apple DNS Profile Generator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Fonts: Geist, Geist Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    rel="stylesheet" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            },
          },
          transitionProperty: {
            width: 'width',
            spacing: 'margin, padding',
          },
        },
      },
    };
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom scrollbar for better visual integration on non-mobile */
    @media (min-width: 640px) {
      html {
        scrollbar-width: thin;
        scrollbar-color: #d4d4d8 transparent;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #d4d4d8;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #a1a1aa;
      }
    }
  </style>
</head>

<body class="bg-[#f5f5f5] text-zinc-800 h-[100dvh] flex justify-center overflow-hidden">
  <!-- Main App Container -->
  <div id="app-wrapper"
    class="w-full max-w-[480px] bg-white h-full sm:h-[95vh] sm:my-auto sm:rounded-2xl sm:shadow-2xl flex flex-col relative overflow-hidden border-zinc-200 sm:border">
    <!-- Header -->
    <header id="stickyHeader"
      class="bg-white/90 backdrop-blur-md z-20 border-b border-zinc-100 p-4 sm:p-6 flex justify-between items-center flex-shrink-0 transition-shadow duration-300">
      <div class="flex items-center gap-2 sm:gap-3">
        <div
          class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white shadow-brand-500/30 shadow-lg">
          <i data-lucide="shield" class="w-4 h-4"></i>
        </div>
        <div>
          <h1 class="font-bold text-2xl tracking-tight text-zinc-900 leading-tight">
            Apple DNS Profile Generator
          </h1>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto relative bg-zinc-50/50 scroll-smooth p-4 sm:p-6" id="mainScroll">
      <form id="profile-form" class="space-y-6 sm:space-y-8">
        <!-- Profile Section -->
        <div>
          <div class="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-6">
            <div class="w-6 h-6 bg-brand-600 rounded-md flex items-center justify-center text-white">
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
            </div>
            <h2 class="font-bold text-zinc-900 tracking-tight">Profile</h2>
          </div>

          <div class="space-y-4 sm:space-y-6">
            <div class="bg-white border border-zinc-200 rounded-xl shadow-sm p-4 sm:p-6 space-y-4 sm:space-y-6">
              <div>
                <label for="profileName"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span>Profile Name</span>
                  <span class="flex items-center gap-2 sm:gap-3">
                    <span
                      class="bg-rose-100 text-rose-600 px-1.5 py-0.5 rounded text-[10px] tracking-widest font-bold">REQUIRED</span>
                    <div class="relative group cursor-help">
                      <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                      <div
                        class="absolute top-full right-[-4px] mt-2 w-48 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal">
                        The name of this configuration profile - displayed in iOS/iPadOS/macOS
                        Settings → VPN & Device Management.
                        <div class="absolute -top-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                      </div>
                    </div>
                  </span>
                </label>
                <input type="text" id="profileName"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-medium"
                  placeholder="My Secure DNS" required />
              </div>

              <div>
                <label for="profileDescription"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span>Profile Description</span>
                  <div class="relative group cursor-help">
                    <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                    <div
                      class="absolute top-full right-[-4px] mt-2 w-56 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                      This description appears when installing or viewing the configuration profile
                      in Settings.
                      <div class="absolute -top-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                    </div>
                  </div>
                </label>
                <textarea id="profileDescription"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-medium text-sm resize-none overflow-hidden"
                  placeholder="Configures device to use Encrypted DNS." rows="1"></textarea>
              </div>

              <div>
                <label for="profileIdentifier"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span>Profile Identifier</span>
                  <div class="relative group cursor-help">
                    <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                    <div
                      class="absolute top-full right-[-4px] mt-2 w-56 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                      A unique reverse-DNS-style identifier. Leave blank to auto-generate.
                      <div class="absolute -top-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                    </div>
                  </div>
                </label>
                <input type="text" id="profileIdentifier"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-mono text-sm"
                  placeholder="com.example.dns" />
              </div>

            </div>

            <!-- Advanced Profile Settings Section -->
            <div class="bg-white border border-zinc-200 rounded-xl overflow-hidden">
              <button type="button" onclick="toggleAccordion('profileAdvanced', 'profileAdvancedIcon')"
                class="w-full flex items-center justify-between p-4 sm:px-6 hover:bg-zinc-50 transition-colors focus:outline-none">
                <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Advanced Profile
                  Settings</span>
                <i data-lucide="chevron-down" id="profileAdvancedIcon"
                  class="w-4 h-4 text-zinc-400 transition-transform duration-200"></i>
              </button>

              <div id="profileAdvanced"
                class="hidden p-4 sm:p-6 border-t border-zinc-100 space-y-4 sm:space-y-6 bg-white">
                <div>
                  <label for="organizationName"
                    class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3">
                    Organization Name
                  </label>
                  <input type="text" id="organizationName"
                    class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-medium"
                    placeholder="My Organization" />
                </div>

                <div>
                  <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                    <span>Payload Scope</span>
                    <div class="relative group cursor-help">
                      <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                      <div
                        class="absolute bottom-full right-[-4px] mb-2 w-56 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                        Apple devices enforce encrypted DNS at the System level. User-level DNS payloads are rejected by iOS/macOS.
                        <div class="absolute -bottom-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                      </div>
                    </div>
                  </label>
                  <div class="grid grid-cols-1 gap-2 sm:gap-3">
                    <label
                      class="relative flex cursor-pointer rounded-xl border border-brand-500 bg-brand-50 p-4 ring-1 ring-brand-500 focus:outline-none transition-all group">
                      <input type="radio" name="payloadScope" value="System" class="peer sr-only" checked />
                      <div class="flex items-start w-full gap-2 sm:gap-3">
                        <i data-lucide="shield"
                          class="w-5 h-5 text-brand-600 transition-colors mt-0.5"></i>
                        <div class="flex flex-col">
                          <div class="flex items-center gap-2">
                            <span class="text-sm font-semibold text-zinc-900">System (Device-wide)</span>
                            <span class="bg-brand-100 text-brand-700 px-1.5 py-0.5 rounded text-[10px] font-bold">REQUIRED</span>
                          </div>
                          <span class="block text-xs text-zinc-500 mt-0.5 leading-snug">Applies system-wide across all apps and users</span>
                        </div>
                      </div>
                    </label>
                  </div>
                </div>

                <div>
                  <label
                    class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                    <span>Payload Removal</span>
                    <span class="flex items-center gap-2 sm:gap-3">
                      <span
                        class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-[10px] tracking-widest font-bold">MDM ONLY</span>
                      <div class="relative group cursor-help">
                        <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                        <div
                          class="absolute bottom-full right-[-4px] mb-2 w-64 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                          Requires a Supervised / MDM-enrolled device. Enabling this on standard consumer devices will cause profile installation to fail.
                          <div class="absolute -bottom-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                        </div>
                      </div>
                    </span>
                  </label>
                  <label
                    class="relative flex cursor-pointer rounded-xl border border-zinc-200 bg-zinc-50 p-4 focus:outline-none transition-all hover:border-brand-200 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-50 has-[:checked]:ring-1 has-[:checked]:ring-brand-500 group">
                    <input type="checkbox" id="payloadRemovalDisallowed" class="peer sr-only" />
                    <div class="flex items-center justify-between w-full h-full">
                      <div class="flex items-center gap-2 sm:gap-3">
                        <i data-lucide="trash-2"
                          class="w-5 h-5 text-zinc-400 group-has-[:checked]:text-brand-600 transition-colors"></i>
                        <div class="flex flex-col">
                          <span class="text-sm font-semibold text-zinc-900">Disallow Removal</span>
                          <span class="block text-xs text-zinc-500 mt-0.5 leading-snug">Prevents manual profile removal (Supervised only)</span>
                        </div>
                      </div>
                      <div
                        class="relative inline-flex h-6 w-11 items-center rounded-full bg-zinc-200 transition-colors group-has-[:checked]:bg-brand-600">
                        <span
                          class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1 group-has-[:checked]:translate-x-6"></span>
                      </div>
                    </div>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>



        <!-- DNS Configuration Section -->
        <div>
          <div class="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-6">
            <div class="w-6 h-6 bg-brand-600 rounded-md flex items-center justify-center text-white">
              <i data-lucide="server" class="w-3.5 h-3.5"></i>
            </div>
            <h2 class="font-bold text-zinc-900 tracking-tight">DNS Configuration</h2>
          </div>

          <div class="space-y-4 sm:space-y-6">
            <div class="bg-white border border-zinc-200 rounded-xl shadow-sm p-4 sm:p-6 space-y-4 sm:space-y-6">
              <div>
                <label for="dnsName"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span>DNS Name</span>
                  <div class="relative group cursor-help">
                    <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                    <div
                      class="absolute top-full right-[-4px] mt-2 w-52 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                      The display name of the DNS payload shown in Settings. Leave blank to use
                      "[Profile Name] DNS".
                      <div class="absolute -top-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                    </div>
                  </div>
                </label>
                <input type="text" id="dnsName"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-medium"
                  placeholder="[Profile Name] DNS" />
              </div>

              <div>
                <label for="dnsDescription"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span>DNS Description</span>
                  <div class="relative group cursor-help">
                    <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                    <div
                      class="absolute top-full right-[-4px] mt-2 w-52 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                      A short description for the DNS payload. Leave blank to use the default.
                      <div class="absolute -top-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                    </div>
                  </div>
                </label>
                <textarea id="dnsDescription"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-medium text-sm resize-none overflow-hidden"
                  placeholder="Configures device to use Encrypted DNS." rows="1"></textarea>
              </div>

              <div>
                <label for="dnsIdentifier"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span>DNS Identifier</span>
                  <div class="relative group cursor-help">
                    <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                    <div
                      class="absolute top-full right-[-4px] mt-2 w-56 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                      The identifier for the inner DNS payload. Leave blank to auto-generate.
                      <div class="absolute -top-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                    </div>
                  </div>
                </label>
                <input type="text" id="dnsIdentifier"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-mono text-sm"
                  placeholder="com.apple.dnsSettings.managed" />
              </div>

              <div>
                <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3">
                  DNS Protocol
                </label>
                <div class="grid grid-cols-1 gap-2 sm:gap-3">
                  <label
                    class="relative flex cursor-pointer rounded-xl border border-zinc-200 bg-zinc-50 p-4 focus:outline-none transition-all hover:border-brand-200 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-50 has-[:checked]:ring-1 has-[:checked]:ring-brand-500 group"
                    id="card-HTTPS">
                    <input type="radio" name="dnsProtocol" value="HTTPS" class="peer sr-only" checked />
                    <div class="flex items-start w-full gap-2 sm:gap-3">
                      <i data-lucide="lock"
                        class="w-5 h-5 text-zinc-400 group-has-[:checked]:text-brand-600 transition-colors mt-0.5"></i>
                      <div class="flex flex-col">
                        <span class="text-sm font-semibold text-zinc-900">DNS-over-HTTPS
                          <span class="text-zinc-500 font-bold whitespace-nowrap ml-1">(DoH)</span></span>
                        <span class="block text-xs text-zinc-500 mt-0.5 leading-snug">Uses HTTPS on port 443, harder to
                          block</span>
                      </div>
                    </div>
                  </label>
                  <label
                    class="relative flex cursor-pointer rounded-xl border border-zinc-200 bg-zinc-50 p-4 focus:outline-none transition-all hover:border-brand-200 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-50 has-[:checked]:ring-1 has-[:checked]:ring-brand-500 group"
                    id="card-TLS">
                    <input type="radio" name="dnsProtocol" value="TLS" class="peer sr-only" />
                    <div class="flex items-start w-full gap-2 sm:gap-3">
                      <i data-lucide="shield-check"
                        class="w-5 h-5 text-zinc-400 group-has-[:checked]:text-brand-600 transition-colors mt-0.5"></i>
                      <div class="flex flex-col">
                        <span class="text-sm font-semibold text-zinc-900">DNS-over-TLS
                          <span class="text-zinc-500 font-bold whitespace-nowrap ml-1">(DoT)</span></span>
                        <span class="block text-xs text-zinc-500 mt-0.5 leading-snug">Uses TLS on port 853, dedicated
                          protocol</span>
                      </div>
                    </div>
                  </label>
                </div>
              </div>

              <div>
                <label for="serverURL"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span id="urlLabel">Server URL (DoH)</span>
                  <span class="flex items-center gap-2 sm:gap-3">
                    <span
                      class="bg-rose-100 text-rose-600 px-1.5 py-0.5 rounded text-[10px] tracking-widest font-bold">REQUIRED</span>
                    <div class="relative group cursor-help">
                      <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                      <div
                        class="absolute bottom-full right-[-4px] mb-2 w-48 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                        <span id="urlHelpText"></span>
                        <div class="absolute -bottom-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                      </div>
                    </div>
                  </span>
                </label>
                <input type="text" id="serverURL"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-mono text-sm"
                  placeholder="https://cloudflare-dns.com/dns-query" required />
              </div>

              <div>
                <label for="serverAddresses"
                  class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                  <span>Server Addresses</span>
                  <div class="relative group cursor-help">
                    <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                    <div
                      class="absolute bottom-full right-[-4px] mb-2 w-56 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                      Can help with the initial connection before DNS resolution. One IPv4/IPv6
                      address per line.
                      <div class="absolute -bottom-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                    </div>
                  </div>
                </label>
                <textarea id="serverAddresses"
                  class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-mono text-sm resize-none overflow-hidden"
                  placeholder="1.1.1.1&#10;1.0.0.1" rows="1"></textarea>
              </div>

            </div>

            <!-- Advanced DNS Options Section -->
            <div class="bg-white border border-zinc-200 rounded-xl overflow-hidden">
              <button type="button" onclick="toggleAccordion('dnsAdditional', 'dnsAdditionalIcon')"
                class="w-full flex items-center justify-between p-4 sm:px-6 hover:bg-zinc-50 transition-colors focus:outline-none">
                <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Advanced DNS Options</span>
                <i data-lucide="chevron-down" id="dnsAdditionalIcon"
                  class="w-4 h-4 text-zinc-400 transition-transform duration-200"></i>
              </button>

              <div id="dnsAdditional"
                class="hidden p-4 sm:p-6 border-t border-zinc-100 space-y-4 sm:space-y-6 bg-white">
                <div>
                  <label
                    class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 sm:mb-3 flex items-center justify-between">
                    <span>DNS Failover</span>
                    <div class="relative group cursor-help">
                      <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                      <div
                        class="absolute bottom-full right-[-4px] mb-2 w-56 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                        Fallback to unencrypted DNS provided by the network when the configured
                        server is unreachable.
                        <div class="absolute -bottom-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                      </div>
                    </div>
                  </label>
                  <label
                    class="relative flex cursor-pointer rounded-xl border border-zinc-200 bg-zinc-50 p-4 focus:outline-none transition-all hover:border-brand-200 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-50 has-[:checked]:ring-1 has-[:checked]:ring-brand-500 group">
                    <input type="checkbox" id="allowFailover" class="peer sr-only" />

                    <div class="relative group cursor-help">
                      <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 hover:text-zinc-600 transition-colors"></i>
                      <div
                        class="absolute bottom-full right-[-4px] mb-2 w-56 p-2 bg-zinc-800 text-white text-[11px] rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none normal-case font-normal whitespace-normal">
                        Disable encrypted DNS on these specific Wi-Fi networks. One SSID per line.
                        <div class="absolute -bottom-1 right-2 w-2 h-2 bg-zinc-800 rotate-45"></div>
                      </div>
                    </div>
                  </label>
                  <textarea id="excludedWifi"
                    class="block w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder-zinc-400 font-mono text-sm resize-none overflow-hidden disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-zinc-100"
                    placeholder="MyHomeNetwork&#10;Silence of the LANs" rows="1"></textarea>

    </main>

    <!-- Bottom Action Bar -->
    <div
      class="bg-white border-t border-zinc-200 p-4 sm:px-6 sm:py-4 flex gap-2 sm:gap-3 items-center justify-between z-20 flex-shrink-0">
      <button type="submit" form="profile-form" id="generateBtn"
        class="flex-1 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white py-3 px-4 rounded-xl font-medium shadow-brand-500/20 shadow-lg transition-all flex items-center justify-center gap-2 sm:gap-3 group">
        <span id="btnContent" class="flex items-center gap-2 sm:gap-3">
          <i data-lucide="download" class="w-4 h-4" id="btnIcon"></i>
          <span id="btnText">Generate .mobileconfig</span>
        </span>
      </button>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    // --- Constants & Config ---
    // (None)

    // --- State Management ---
    // (None)

    // --- DOM Elements ---
    const els = {
      appWrapper: document.getElementById('app-wrapper'),
      mainScroll: document.getElementById('mainScroll'),
      stickyHeader: document.getElementById('stickyHeader'),
      profileForm: document.getElementById('profile-form'),
      profileName: document.getElementById('profileName'),
      profileDescription: document.getElementById('profileDescription'),
      profileIdentifier: document.getElementById('profileIdentifier'),
      organizationName: document.getElementById('organizationName'),
      payloadRemovalDisallowed: document.getElementById('payloadRemovalDisallowed'),
      dnsName: document.getElementById('dnsName'),
      dnsDescription: document.getElementById('dnsDescription'),
      dnsIdentifier: document.getElementById('dnsIdentifier'),
      serverURL: document.getElementById('serverURL'),
      serverAddresses: document.getElementById('serverAddresses'),
      allowFailover: document.getElementById('allowFailover'),
      prohibitDisablement: document.getElementById('prohibitDisablement'),
      ifaceWifi: document.getElementById('ifaceWifi'),
      ifaceCellular: document.getElementById('ifaceCellular'),
      ifaceEthernet: document.getElementById('ifaceEthernet'),
      excludedDomains: document.getElementById('excludedDomains'),
      excludedWifi: document.getElementById('excludedWifi'),
      generateBtn: document.getElementById('generateBtn'),
      btnIcon: document.getElementById('btnIcon'),
      btnText: document.getElementById('btnText'),
      urlLabel: document.getElementById('urlLabel'),
      urlHelpText: document.getElementById('urlHelpText'),
      protocolRadios: document.querySelectorAll('input[name="dnsProtocol"]')
    };

    // --- Initialization ---
    // Boot
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupMobileHeight();
      setupEventListeners();
      setupAutoExpand();

      // Initial UI State
      const activeProtocol = document.querySelector('input[name="dnsProtocol"]:checked');
      if (activeProtocol) updateProtocolUI(activeProtocol.value);
    });

    // --- Event Listeners ---
    function setupEventListeners() {
      els.mainScroll.addEventListener('scroll', () => {
        if (els.mainScroll.scrollTop > 10) {
          els.stickyHeader.classList.add('shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]');
        } else {
          els.stickyHeader.classList.remove('shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]');
        }
      });

      els.protocolRadios.forEach((radio) => {
        radio.addEventListener('change', (e) => {
          updateProtocolUI(e.target.value);
        });
      });

      els.profileForm.addEventListener('submit', (e) => {
        e.preventDefault();
        handleGenerate();
      });
    }

    // --- Core Logic ---
    function normalizeServerEndpoint(protocol, rawEndpoint) {
      let endpoint = (rawEndpoint || '').trim();
      if (!endpoint) return '';
      if (protocol === 'HTTPS') {
        if (!/^https?:\/\//i.test(endpoint)) {
          endpoint = 'https://' + endpoint;
        }
      } else if (protocol === 'TLS') {
        endpoint = endpoint.replace(/^[a-zA-Z]+:\/\//, '').split('/')[0].split(':')[0].trim();
      }
      return endpoint;
    }

    function handleGenerate() {
      const dnsProtocol = document.querySelector('input[name="dnsProtocol"]:checked').value;
      const normalizedEndpoint = normalizeServerEndpoint(dnsProtocol, els.serverURL.value);

      const configXml = generateMobileConfig({
        profileName: els.profileName.value.trim(),
        profileDescription: els.profileDescription.value.trim(),
        profileIdentifier: els.profileIdentifier.value.trim(),
        organizationName: els.organizationName.value.trim(),
        payloadRemovalDisallowed: els.payloadRemovalDisallowed.checked,
        dnsName: els.dnsName.value.trim(),
        dnsDescription: els.dnsDescription.value.trim(),
        dnsIdentifier: els.dnsIdentifier.value.trim(),
        dnsProtocol,
        serverURL: normalizedEndpoint,
        serverAddresses: els.serverAddresses.value,
        allowFailover: els.allowFailover.checked,
        prohibitDisablement: els.prohibitDisablement.checked,
        ifaceWifi: els.ifaceWifi.checked,
        ifaceCellular: els.ifaceCellular.checked,
        ifaceEthernet: els.ifaceEthernet.checked,
        excludedDomains: els.excludedDomains.value,
        excludedWifi: els.excludedWifi.value,
      });

      const filename = els.profileName.value.trim().replace(/\s+/g, '_').toLowerCase() + '.mobileconfig';
      downloadConfig(filename, configXml);
      showSuccessState();
    }

    function generateMobileConfig(data) {
      const payloadUUID = generateUUID();
      const profileUUID = generateUUID();

      const profileIdentifier = data.profileIdentifier || `com.apple.dns.${profileUUID}`;
      const dnsPayloadIdentifier =
        data.dnsIdentifier || `com.apple.dnsSettings.managed.${payloadUUID}`;

      const displayName =
        data.dnsName ||
        (data.profileName.toLowerCase().endsWith('dns')
          ? data.profileName
          : `${data.profileName} DNS`);

      const ips = (data.serverAddresses || '')
        .split('\n')
        .map((ip) => ip.trim())
        .filter((ip) => ip !== '');

      const config = [
        '<?xml version="1.0" encoding="UTF-8"?>',
        '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
        '<plist version="1.0">',
        '<dict>',
        '    <key>PayloadDisplayName</key>',
        '    <string>' + escapeXml(data.profileName) + '</string>',
        '    <key>PayloadDescription</key>',
        '    <string>' +
        escapeXml(
          data.profileDescription ||
          'Adds ' + data.profileName + ' HTTPS/TLS DNS configuration.',
        ) +
        '</string>',
        '    <key>PayloadIdentifier</key>',
        '    <string>' + escapeXml(profileIdentifier) + '</string>',
        data.organizationName
          ? '    <key>PayloadOrganization</key>\n    <string>' +
          escapeXml(data.organizationName) +
          '</string>'
          : null,
        data.payloadRemovalDisallowed
          ? '    <key>PayloadRemovalDisallowed</key>\n    <true/>'
          : null,
        '    <key>PayloadScope</key>',
        '    <string>System</string>',
        '    <key>PayloadType</key>',
        '    <string>Configuration</string>',
        '    <key>PayloadUUID</key>',
        '    <string>' + profileUUID + '</string>',
        '    <key>PayloadVersion</key>',
        '    <integer>1</integer>',
        '    <key>PayloadContent</key>',
        '    <array>',
        '        <dict>',
        '            <key>DNSSettings</key>',
        '            <dict>',
        '                <key>DNSProtocol</key>',
        '                <string>' + escapeXml(data.dnsProtocol) + '</string>',
        data.dnsProtocol === 'HTTPS'
          ? '                <key>ServerURL</key>'
          : '                <key>ServerName</key>',
        '                <string>' + escapeXml(data.serverURL) + '</string>',
      ];

      if (data.allowFailover) {
        config.push('                <key>AllowFailover</key>', '                <true/>');
      }

      if (ips.length > 0) {
        config.push('                <key>ServerAddresses</key>');
        config.push('                <array>');
        ips.forEach((ip) => {
          config.push('                    <string>' + escapeXml(ip) + '</string>');
        });
        config.push('                </array>');
      }

      config.push('            </dict>');

      const excludedWifi = (data.excludedWifi || '')
        .split('\n')
        .map((s) => s.trim())
        .filter((s) => s !== '');
      const excludedDomains = (data.excludedDomains || '')
        .split('\n')
        .map((s) => s.trim())
        .filter((s) => s !== '');
      const interfaces = [];
      if (data.ifaceWifi) interfaces.push('WiFi');
      if (data.ifaceCellular) interfaces.push('Cellular');
      if (data.ifaceEthernet) interfaces.push('Ethernet');

      const hasRules =
        excludedWifi.length > 0 || excludedDomains.length > 0 || interfaces.length < 3;

      if (hasRules) {
        config.push('            <key>OnDemandRules</key>');
        config.push('            <array>');

        if (excludedWifi.length > 0) {
          config.push('                <dict>');
          config.push('                    <key>Action</key>');
          config.push('                    <string>Disconnect</string>');
          config.push('                    <key>InterfaceTypeMatch</key>');
          config.push('                    <string>WiFi</string>');
          config.push('                    <key>SSIDMatch</key>');
          config.push('                    <array>');
          excludedWifi.forEach((ssid) => {
            config.push('                        <string>' + escapeXml(ssid) + '</string>');
          });
          config.push('                    </array>');
          config.push('                </dict>');
        }

        interfaces.forEach((iface) => {
          config.push('                <dict>');
          if (excludedDomains.length > 0) {
            config.push('                    <key>Action</key>');
            config.push('                    <string>EvaluateConnection</string>');
            config.push('                    <key>ActionParameters</key>');
            config.push('                    <array>');
            config.push('                        <dict>');
            config.push('                            <key>DomainAction</key>');
            config.push('                            <string>NeverConnect</string>');
            config.push('                            <key>Domains</key>');
            config.push('                            <array>');
            excludedDomains.forEach((domain) => {
              config.push(
                '                                <string>' + escapeXml(domain) + '</string>',
              );
            });
            config.push('                            </array>');
            config.push('                        </dict>');
            config.push('                    </array>');
          } else {
            config.push('                    <key>Action</key>');
            config.push('                    <string>Connect</string>');
          }
          config.push('                    <key>InterfaceTypeMatch</key>');
          config.push('                    <string>' + iface + '</string>');
          config.push('                </dict>');
        });

        config.push('                <dict>');
        config.push('                    <key>Action</key>');
        config.push('                    <string>Disconnect</string>');
        config.push('                </dict>');

        config.push('            </array>');
      }

      config.push(
        '            <key>PayloadDisplayName</key>',
        '            <string>' + escapeXml(displayName) + '</string>',
        '            <key>PayloadDescription</key>',
        '            <string>' +
        escapeXml(data.dnsDescription || 'Configures device to use Encrypted DNS.') +
        '</string>',
        '            <key>PayloadIdentifier</key>',
        '            <string>' + escapeXml(dnsPayloadIdentifier) + '</string>',
        '            <key>PayloadType</key>',
        '            <string>com.apple.dnsSettings.managed</string>',
        '            <key>PayloadUUID</key>',
        '            <string>' + payloadUUID + '</string>',
        '            <key>PayloadVersion</key>',
        '            <integer>1</integer>',
      );

      if (data.prohibitDisablement) {
        config.push('            <key>ProhibitDisablement</key>', '            <true/>');
      }

      config.push('        </dict>', '    </array>', '</dict>', '</plist>');

      return config.filter((line) => line !== null).join('\n');
    }

    function downloadConfig(filename, content) {
      const blob = new Blob([content], { type: 'application/x-apple-aspen-config' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    }

    // --- UI Updates ---
    function updateProtocolUI(protocol) {
      if (protocol === 'HTTPS') {
        els.urlLabel.textContent = 'Server URL (DoH)';
        els.serverURL.placeholder = 'https://cloudflare-dns.com/dns-query';
        els.urlHelpText.textContent = 'The HTTPS endpoint of your DNS provider.';
      } else {
        els.urlLabel.textContent = 'Server Name (DoT)';
        els.serverURL.placeholder = '1dot1dot1dot1.cloudflare-dns.com';
        els.urlHelpText.textContent = 'The TLS hostname of your DNS provider.';
      }
    }

    function toggleAccordion(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);
      const isHidden = content.classList.contains('hidden');
      content.classList.toggle('hidden', !isHidden);
      icon.style.transform = isHidden ? 'rotate(180deg)' : '';

      if (isHidden && typeof autoResizeTextarea === 'function') {
        const textareas = content.querySelectorAll('textarea');
        textareas.forEach(ta => autoResizeTextarea(ta));
      }
    }

    function showSuccessState() {
      const originalIconName = els.btnIcon.getAttribute('data-lucide');
      const originalText = els.btnText.textContent;

      els.generateBtn.classList.remove(
        'bg-brand-600',
        'hover:bg-brand-700',
        'active:bg-brand-800',
        'shadow-brand-500/20',
      );
      els.generateBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/20');

      els.btnIcon.setAttribute('data-lucide', 'check');
      els.btnText.textContent = 'Downloaded!';
      lucide.createIcons();

      setTimeout(() => {
        els.generateBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/20');
        els.generateBtn.classList.add(
          'bg-brand-600',
          'hover:bg-brand-700',
          'active:bg-brand-800',
          'shadow-brand-500/20',
        );
        els.btnIcon.setAttribute('data-lucide', originalIconName);
        els.btnText.textContent = originalText;
        lucide.createIcons();
      }, 2500);
    }

    // Auto Expand Textareas
    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight + 2) + 'px';
    }

    function setupAutoExpand() {
      const textareas = document.querySelectorAll('textarea');
      textareas.forEach(ta => {
        ta.addEventListener('input', () => autoResizeTextarea(ta));
        if (ta.offsetParent !== null) {
          autoResizeTextarea(ta);
        }
      });
      window.addEventListener('resize', () => {
        textareas.forEach(ta => {
          if (ta.offsetParent !== null) autoResizeTextarea(ta);
        });
      });
    }

    // --- Utilities ---
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        const r = (Math.random() * 16) | 0,
          v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16).toUpperCase();
      });
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, function (c) {
        switch (c) {
          case '<':
            return '&lt;';
          case '>':
            return '&gt;';
          case '&':
            return '&amp;';
          case "'":
            return '&apos;';
          case '"':
            return '&quot;';
        }
      });
    }

    function setupMobileHeight() {
      if (!els.appWrapper) return;
      function setHeight() {
        if (window.innerWidth >= 640) {
          els.appWrapper.style.height = '';
          return;
        }
        if (
          document.activeElement &&
          (document.activeElement.tagName === 'INPUT' ||
            document.activeElement.tagName === 'TEXTAREA')
        ) {
          return;
        }
        els.appWrapper.style.height = `${window.innerHeight}px`;
      }
      window.addEventListener('resize', setHeight);
      setHeight();
    }
  </script>
</body>

</html>
